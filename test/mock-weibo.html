<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>微博注册 (mock)</title>
</head>
<body>
  <h2>个人注册</h2>
  <div>
    <span>* 邮箱：</span>
    <input id="email" type="text" placeholder="请输入您的常用邮箱" />
    <span id="tip" style="color:#e6162d"></span>
  </div>
  <script>
    // Mock of Weibo's on-blur availability check. Mirrors the real page:
    // fill the email, blur, an XHR runs, then a prompt appears next to the field.
    const el = document.getElementById('email');
    const tip = document.getElementById('tip');
    async function runCheck() {
      const email = el.value.trim();
      tip.textContent = '';
      if (!email) return;
      try {
        const r = await fetch('/api/check_email?email=' + encodeURIComponent(email));
        const j = await r.json();
        tip.textContent = j.msg || '';
      } catch (e) {
        tip.textContent = '';
      }
    }
    el.addEventListener('blur', runCheck);
    el.addEventListener('change', runCheck);
  </script>
</body>
</html>
