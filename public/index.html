<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微博邮箱注册检测</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --ink: #1f2328;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #e6162d;
      --brand-dark: #c50f24;
      --ok: #157347;
      --ok-bg: #e8f5ee;
      --no: #b42318;
      --no-bg: #fdecea;
      --warn: #92600a;
      --warn-bg: #fdf4e3;
      --neutral: #374151;
      --neutral-bg: #eef0f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 16px 64px;
    }
    .wrap { width: 100%; max-width: 720px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--brand); color: #fff; font-weight: 700;
      display: grid; place-items: center; font-size: 18px;
    }
    h1 { font-size: 20px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; margin: 2px 0 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.05);
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    textarea {
      width: 100%; min-height: 96px; resize: vertical; padding: 12px 14px;
      font-size: 14px; line-height: 1.6; border: 1px solid var(--line);
      border-radius: 10px; outline: none; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(230,22,45,.12); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    button {
      padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      color: #fff; background: var(--brand); border: none; border-radius: 10px;
      transition: background .15s, opacity .15s; white-space: nowrap;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--neutral); border: 1px solid var(--line); }
    button.ghost:hover { background: var(--neutral-bg); }
    .count { color: var(--muted); font-size: 13px; margin-left: auto; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
    code { background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 5px; font-size: 12px; }

    .progress { margin-top: 16px; font-size: 13px; color: var(--muted); display: none; }
    .progress.show { display: block; }
    .bar { height: 6px; background: var(--neutral-bg); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .2s; }

    .summary { display: none; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .summary.show { display: flex; }
    .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--neutral-bg); color: var(--neutral); }
    .chip b { font-weight: 800; }
    .chip.c-registered { background: var(--no-bg); color: var(--no); }
    .chip.c-not { background: var(--ok-bg); color: var(--ok); }
    .chip.c-other { background: var(--warn-bg); color: var(--warn); }

    .tablewrap { margin-top: 14px; overflow-x: auto; display: none; }
    .tablewrap.show { display: block; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    td.idx { color: var(--muted); width: 34px; }
    td.email { word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    td.msg { color: var(--muted); word-break: break-all; }
    .badge { display: inline-block; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .b-registered { background: var(--no-bg); color: var(--no); }
    .b-not_registered { background: var(--ok-bg); color: var(--ok); }
    .b-unsupported, .b-inconclusive { background: var(--warn-bg); color: var(--warn); }
    .b-invalid_email, .b-error, .b-pending { background: var(--neutral-bg); color: var(--neutral); }
    .b-pending { opacity: .8; }
    .spinner {
      width: 13px; height: 13px; border: 2px solid rgba(0,0,0,.15);
      border-top-color: var(--neutral); border-radius: 50%; display: inline-block;
      animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .warn { margin-top: 12px; font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; }
    .notice { margin-top: 22px; font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding: 4px 0 4px 12px; }
    .notice b { color: var(--neutral); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">微</div>
      <div>
        <h1>微博邮箱注册检测</h1>
        <div class="sub">仅用于个人学习 / 授权测试</div>
      </div>
    </div>

    <div class="card">
      <label for="emails">邮箱地址（可输入多个：每行一个，或用逗号 / 空格 / 分号分隔）</label>
      <textarea id="emails" placeholder="例如：&#10;name1@163.com&#10;name2@gmail.com, name3@qq.com"
                autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="toolbar">
        <button id="btn" type="button">检测</button>
        <button id="stop" type="button" class="ghost" hidden>停止</button>
        <button id="copy" type="button" class="ghost" hidden>复制结果</button>
        <button id="clear" type="button" class="ghost">清空</button>
        <span class="count" id="count">0 个邮箱</span>
      </div>

      <div class="hint">
        逐个检测（每个之间有间隔）。返回「该邮箱已注册，请直接登录」为<b>已注册</b>；可注册为<b>未注册</b>；
        <b>邮箱不可用</b>多为非法格式（如全数字 <code>@163.com</code>）——已注册的邮箱会优先显示「已注册」；
        频率过高会触发微博风控，返回<b>无法确定</b>。请减少数量、降低频率。单次最多 <b id="maxn">200</b> 个。
      </div>

      <div class="progress" id="progress">
        <span id="progtext"></span>
        <div class="bar"><i id="progbar"></i></div>
      </div>

      <div class="warn" id="warn" hidden></div>

      <div class="summary" id="summary"></div>

      <div class="tablewrap" id="tablewrap">
        <table>
          <thead>
            <tr><th class="idx">#</th><th>邮箱</th><th>结果</th><th>微博返回</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="notice">
      <b>使用须知：</b>本工具通过调用微博注册页自身的校验接口判断，仅供<b>个人学习与授权范围内的安全测试</b>。
      请只检测你本人拥有或已获授权的邮箱，合理控制数量与频率，遵守微博服务条款与当地法律。
    </div>
  </div>

  <script>
    const MAX_EMAILS = 200;
    const API_URL = window.API_URL || '/api/check';
    const $ = (id) => document.getElementById(id);
    const emailsEl = $('emails'), btn = $('btn'), stopBtn = $('stop'),
          copyBtn = $('copy'), clearBtn = $('clear');
    $('maxn').textContent = MAX_EMAILS;

    const VERDICTS = {
      registered:     { zh: '已注册' },
      not_registered: { zh: '未注册' },
      unsupported:    { zh: '邮箱不可用' },
      inconclusive:   { zh: '无法确定' },
      invalid_email:  { zh: '格式无效' },
      error:          { zh: '出错' },
    };

    let cancelled = false;
    let lastResults = [];

    function parseEmails(text) {
      const parts = text.split(/[\s,;]+/).map((s) => s.trim()).filter(Boolean);
      const seen = new Set(), out = [];
      for (const p of parts) {
        const key = p.toLowerCase();
        if (!seen.has(key)) { seen.add(key); out.push(p); }
      }
      return out;
    }

    function updateCount() {
      const n = parseEmails(emailsEl.value).length;
      $('count').textContent = n + ' 个邮箱' + (n > MAX_EMAILS ? `（超出，仅检测前 ${MAX_EMAILS} 个）` : '');
    }
    emailsEl.addEventListener('input', updateCount);

    function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

    const SOFT_REASONS = ['challenge_or_rate_limit', 'bad_response', 'unexpected_response', 'rate_limited'];
    async function checkOne(email) {
      let wait = 3000;
      for (let attempt = 0; attempt < 3; attempt++) {
        let resp;
        try {
          resp = await fetch(API_URL + '?email=' + encodeURIComponent(email));
        } catch (e) {
          return { email, status: 'error', message: '无法连接后端：' + e.message };
        }
        if (resp.status === 429) { await sleep(wait); wait *= 2; continue; }
        let data;
        try { data = await resp.json(); }
        catch (e) { return { email, status: 'error', message: '返回解析失败' }; }
        if (data.status === 'inconclusive' && SOFT_REASONS.includes(data.reason) && attempt < 2) {
          await sleep(wait); wait *= 2; continue;
        }
        return data;
      }
      return { email, status: 'inconclusive', reason: 'rate_limited', message: '疑似风控/限速，多次重试仍无法确定' };
    }

    function badge(status) {
      const v = VERDICTS[status] ? VERDICTS[status].zh : status;
      return `<span class="badge b-${status}">${v}</span>`;
    }

    function renderSummary() {
      const counts = {};
      for (const r of lastResults) counts[r.status] = (counts[r.status] || 0) + 1;
      const order = ['registered','not_registered','unsupported','inconclusive','invalid_email','error'];
      const cls = { registered:'c-registered', not_registered:'c-not' };
      const chips = order.filter((s) => counts[s]).map((s) =>
        `<span class="chip ${cls[s]||'c-other'}">${VERDICTS[s].zh} <b>${counts[s]}</b></span>`
      );
      const sEl = $('summary');
      sEl.innerHTML = chips.join('');
      sEl.classList.toggle('show', chips.length > 0);
    }

    function setRow(i, email, cellHtml, msg) {
      let tr = document.getElementById('row' + i);
      if (!tr) {
        tr = document.createElement('tr');
        tr.id = 'row' + i;
        tr.innerHTML = `<td class="idx">${i + 1}</td><td class="email"></td><td class="res"></td><td class="msg"></td>`;
        $('tbody').appendChild(tr);
        tr.querySelector('.email').textContent = email;
      }
      tr.querySelector('.res').innerHTML = cellHtml;
      tr.querySelector('.msg').textContent = msg || '';
    }

    async function run() {
      let list = parseEmails(emailsEl.value);
      if (list.length === 0) { emailsEl.focus(); return; }
      if (list.length > MAX_EMAILS) list = list.slice(0, MAX_EMAILS);

      cancelled = false;
      lastResults = [];
      btn.disabled = true; btn.textContent = '检测中';
      stopBtn.hidden = false; copyBtn.hidden = true;
      $('tbody').innerHTML = '';
      $('tablewrap').classList.add('show');
      $('progress').classList.add('show');
      $('summary').classList.remove('show');
      $('warn').hidden = true;

      let inconcStreak = 0;
      for (let i = 0; i < list.length; i++) {
        if (cancelled) break;
        const email = list[i];
        setRow(i, email, '<span class="badge b-pending"><span class="spinner"></span>检测中</span>', '');
        $('progtext').textContent = `检测中 ${i + 1} / ${list.length}：${email}`;
        $('progbar').style.width = ((i) / list.length * 100) + '%';

        const res = await checkOne(email);
        lastResults.push(res);
        const msg = (res.evidence && res.evidence.msg) || res.message || (res.reason || '');
        setRow(i, email, badge(res.status || 'error'), msg);
        renderSummary();
        $('progbar').style.width = ((i + 1) / list.length * 100) + '%';

        inconcStreak = res.status === 'inconclusive' ? inconcStreak + 1 : 0;
        if (inconcStreak >= 3) {
          const w = $('warn');
          w.hidden = false;
          w.textContent = '⚠ 连续多个「无法确定」，疑似触发微博风控 / 限速。已自动放慢并重试；建议减少数量、降低频率或稍后再试。未被限速时，已注册的邮箱才会稳定显示「已注册」。';
        }
      }

      $('progtext').textContent = cancelled
        ? `已停止，完成 ${lastResults.length} / ${list.length}`
        : `完成，共检测 ${lastResults.length} 个`;
      btn.disabled = false; btn.textContent = '检测';
      stopBtn.hidden = true;
      copyBtn.hidden = lastResults.length === 0;
    }

    btn.addEventListener('click', run);
    stopBtn.addEventListener('click', () => { cancelled = true; stopBtn.hidden = true; });
    clearBtn.addEventListener('click', () => {
      emailsEl.value = ''; updateCount();
      $('tbody').innerHTML = '';
      $('tablewrap').classList.remove('show');
      $('summary').classList.remove('show');
      $('progress').classList.remove('show');
      $('warn').hidden = true;
      copyBtn.hidden = true;
    });
    copyBtn.addEventListener('click', async () => {
      const lines = ['email\tstatus\tregistered\tmessage'];
      for (const r of lastResults) {
        const zh = VERDICTS[r.status] ? VERDICTS[r.status].zh : r.status;
        const msg = ((r.evidence && r.evidence.msg) || r.message || '').replace(/\s+/g, ' ');
        lines.push([r.email, zh, r.registered, msg].join('\t'));
      }
      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        copyBtn.textContent = '已复制 ✓';
        setTimeout(() => (copyBtn.textContent = '复制结果'), 1500);
      } catch { copyBtn.textContent = '复制失败'; }
    });

    emailsEl.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
    });
    updateCount();
  </script>
</body>
</html>
